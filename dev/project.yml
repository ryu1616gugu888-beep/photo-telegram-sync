name: PhotoTelegramSync
options:
  bundleIdPrefix: com.luca
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  PhotoTelegramSync:
    type: application
    platform: iOS
    sources:
      - path: Sources/PhotoTelegramSync
    info:
      path: Sources/PhotoTelegramSync/Info.plist
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "撮影した写真・動画をTelegramへ自動転送するために、写真ライブラリへのアクセスが必要です。"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - phototelegramsync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luca.phototelegramsync
        PRODUCT_NAME: PhotoTelegramSync
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
  PhotoTelegramSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PhotoTelegramSyncTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PhotoTelegramSync
schemes:
  PhotoTelegramSync:
    build:
      targets:
        PhotoTelegramSync: all
        PhotoTelegramSyncTests: [test]
    test:
      config: Debug
      targets:
        - PhotoTelegramSyncTests
